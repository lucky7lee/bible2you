name: Build Android APK & Google Play AAB

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'android/app/release-key.jks'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build DayBible2U APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Node.js 20 & Build Web App
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install npm dependencies & Build Vite dist
        run: |
          npm ci
          npm run build

      - name: 4. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 6. Accept Android SDK Licenses & Prepare SDK 36
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true
          fi

      - name: 7. Sync Built Web App (dist/) into Android Assets
        run: |
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: 8. Prepare Persistent Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="android/app/release-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Using RELEASE_KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          elif [ -f "$KEYSTORE_PATH" ]; then
            echo "Using existing release-key.jks from repository..."
          else
            echo "Generating new release-key.jks for DayBible2U APK & AAB signing..."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -alias daybible2u \
              -storepass daybible2u2026 \
              -keypass daybible2u2026 \
              -dname "CN=DayBible2U, OU=App, O=Lucky7Lee, L=Seoul, S=Seoul, C=KR"
          fi

      - name: 9. Build Signed Release APK & Google Play AAB
        working-directory: android
        run: |
          gradle assembleRelease bundleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }} \
            --no-daemon --stacktrace

      - name: 10. Collect Output Files
        run: |
          mkdir -p dist_output
          cp android/app/build/outputs/apk/release/app-release.apk dist_output/DayBible2U-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist_output/DayBible2U-playstore.aab
          cp playstore-icon-512.png dist_output/playstore-icon-512.png
          cp playstore-feature-graphic.png dist_output/playstore-feature-graphic.png
          cp android/app/release-key.jks dist_output/release-key.jks

      - name: 11. Upload Build Artifacts (APK + AAB + Graphics + Keystore Backup)
        uses: actions/upload-artifact@v4
        with:
          name: DayBible2U-Android-v1.0.${{ github.run_number }}
          path: |
            dist_output/DayBible2U-release.apk
            dist_output/DayBible2U-playstore.aab
            dist_output/playstore-icon-512.png
            dist_output/playstore-feature-graphic.png
            dist_output/release-key.jks
          if-no-files-found: error

      - name: 12. Publish / Update GitHub Release for Direct Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "📖 데이바이블2U (DayBible2U) Android APK & Google Play AAB (v1.0.${{ github.run_number }})"
          body: |
            ### 📱 안드로이드 스마트폰 설치 파일
            * **`DayBible2U-release.apk`**: 안드로이드 스마트폰에 바로 설치해 테스트할 수 있는 서명된 APK 파일입니다. (Google AdMob 테스트 광고, 카메라 얼굴 스캔, 사진 업로드, 두 손가락 확대 지원)

            ### 🏪 Google Play 스토어 비공개 테스트 / 정식 등록용 파일
            * **`DayBible2U-playstore.aab`**: Google Play Console 비공개 테스트에 바로 업로드할 수 있는 Android App Bundle 파일입니다 (`targetSdk 36`, 정식 릴리스 서명 완료).
            * **`playstore-icon-512.png`**: Google Play 스토어 앱 아이콘 (512×512 PNG)
            * **`playstore-feature-graphic.png`**: Google Play 스토어 그래픽 이미지 (1024×500 PNG)
            * **개인정보처리방침 URL**: `https://lucky7lee.github.io/bible2you/privacy.html`
            * **app-ads.txt URL**: `https://lucky7lee.github.io/bible2you/app-ads.txt`
          files: |
            dist_output/DayBible2U-release.apk
            dist_output/DayBible2U-playstore.aab
            dist_output/playstore-icon-512.png
            dist_output/playstore-feature-graphic.png
        continue-on-error: true
